version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

    # Keep Django on the current 5.2 LTS release line.
    # Patch updates remain enabled, while regular minor/major
    # version updates are intentionally ignored.
    ignore:
      - dependency-name: "Django"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5